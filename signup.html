<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustChain | Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <form id="signupForm">
      <div class="input-group">
        <label>USERNAME</label>
        <input type="text" id="username" placeholder="Choose a name" required>
      </div>
      <div class="input-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="email" placeholder="example@mail.com" required>
        <div id="emailError" class="field-error"></div>
      </div>
      <div class="input-group">
        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="Min. 6 characters" required>
      </div>
      <div class="input-group">
        <label>CONFIRM PASSWORD</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
        <div id="confirmError" class="field-error"></div>
      </div>
      <button type="submit" id="submitBtn">Create Account</button>
    </form>
    <div class="switch">Already a member? <a href="index.html">Login</a></div>
  </div>

  <script type="module">
    import { startSignup } from "./auth.js";
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true; btn.innerText = "Processing...";
      await startSignup(
        document.getElementById("email").value,
        document.getElementById("username").value,
        document.getElementById("password").value,
        document.getElementById("confirmPassword").value
      );
      btn.disabled = false; btn.innerText = "Create Account";
    });
  </script>
</body>
</html>
