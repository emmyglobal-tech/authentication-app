<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustChain | Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2 id="statusTitle">Accessing Vault...</h2>
    <p id="userDisplay" style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Checking session...</p>
    
    <div style="background: #1e2539; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: left;">
      <p style="font-size: 11px; color: #8b5cf6; font-weight: bold;">TOTAL BALANCE</p>
      <h1 style="font-size: 32px; margin-top: 5px;">$0.00</h1>
    </div>

    <button id="logoutBtn" style="background: transparent; border: 1px solid #334155;">Secure Logout</button>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, reload } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { logoutUser } from "./auth.js";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        await reload(user);
        if (user.email === "emmanuelglobal101@gmail.com") {
          window.location.href = "admin.html";
          return;
        }
        if (user.emailVerified) {
          document.getElementById('statusTitle').textContent = `Welcome, ${user.displayName || 'Client'}`;
          document.getElementById('userDisplay').textContent = user.email;
        } else { window.location.href = "login.html"; }
      } else { window.location.href = "login.html"; }
    });
    document.getElementById('logoutBtn').addEventListener('click', logoutUser);
  </script>
</body>
</html>
