<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustChain | Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="preloader" style="display:none;"><span class="loader"></span></div>
  <div class="card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="input-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <div id="emailError" class="field-error"></div>
      </div>
      
      <div class="input-group">
        <label>PASSWORD</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>
        <div id="passwordError" class="field-error"></div>
      </div>

      <button type="submit" id="loginBtn">Login to Dashboard</button>
    </form>
    <div class="switch">
      New to TrustChain? <a href="signup.html">Create Account</a><br>
      <a id="forgotPass" style="font-size: 11px; margin-top: 10px; display: inline-block; cursor: pointer;">Forgot Password?</a>
    </div>
  </div>

  <script type="module">
    import { loginUser, resetUserPassword } from "./auth.js";

    // Toggle Password Visibility
    const togglePass = document.querySelector('#togglePassword');
    const passInput = document.querySelector('#password');
    togglePass.addEventListener('click', () => {
      const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passInput.setAttribute('type', type);
      togglePass.classList.toggle('fa-eye-slash');
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("preloader").style.display = "flex";
      await loginUser(document.getElementById("email").value, document.getElementById("password").value);
      document.getElementById("preloader").style.display = "none";
    });

    document.getElementById("forgotPass").addEventListener("click", () => {
      resetUserPassword(document.getElementById("email").value);
    });
  </script>
</body>
</html>
